<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        .container {
            border: 3px solid red;
            display: grid;
            gap: 10px;
            place-items: normal normal;
            place-content: normal normal;
            
            grid-template-rows: repeat(3, 100px);
            grid-auto-rows: 100px; /* define o tamanho padrão das linhas criadas automaticamente no CSS Grid, ou seja, linhas adicionadas implicitamente quando há mais itens do que células definidas por grid-template-rows. */
            grid-template-columns: 80px 60% 1fr;
            grid-auto-columns: 1fr; /* mesma ideia do "grid-auto-rows", mas aqui se aplica às colunas */
            grid-auto-flow: column; /* valor padrão é row. define a direção que itens adicionados implicitamente (sem posição fixa) entram no grid */
        }

        .item {
            border: 3px solid blue;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div> <!-- item implícito -->
    </div>
</body>
</html>
