<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        .container {
            border: 3px solid red;
            height: 250px;

            display: grid;
            grid-template-columns: auto auto auto; /* varia a quantidade de colunas conforme a quantidade de valores passados */
            grid-template-rows: auto auto auto; /* mesma ideia do "grid-template columns", mas aqui se aplica às linhas */
            gap: 10px; /* antigo "grid-gap". serve para dar espaçamento entre os itens */
        }

        .item {
            border: 3px solid blue;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
