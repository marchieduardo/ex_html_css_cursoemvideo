<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox e Radio buttom</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.py" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <!--
                Radio buttons usam o mesmo "name" para indicar que fazem parte do mesmo grupo lógico. Isso garante que apenas uma opção possa ser selecionada por vez, pois o navegador controla a exclusividade dentro desse name.
            -->
            <label>
                <input
                    type="radio"
                    name="sex"
                    id="male"
                    checked
                    value="M"
                >
                Masculino
            </label>
            <label>
                <input
                    type="radio"
                    name="sex"
                    id="female"
                    value="F"
                >
                Feminino
            </label>
            <!--
                Atributos:

                checked = para checkbox ou radio button vir marcado por padrão;

                value = nestes casos(caixas para marcar) é o valor que será enviado ao selecionar determinada checkbox/radio button. Caso não configurado o value, o valor enviado seria on/off;
            -->
        </fieldset>

        <fieldset>
            <legend>Esportes favoritos</legend>
            <!--
                Usa-se o mesmo "name" em vários checkboxes para que o backend entenda que eles pertencem ao mesmo campo lógico. O sufixo [] indica que o campo aceita múltiplos valores, fazendo com que os dados sejam tratados como uma lista/array e evitando perda de valores no processamento.
            -->
            <div>
                <input
                    type="checkbox"
                    name="sport[]"
                    id="fut-id"
                    value="futebol"
                >
                <label for="fut-id">Futebol</label>
            </div>
            <div>
                <input
                    type="checkbox"
                    name="sport[]"
                    id="basq-id"
                    value="basquete"
                >
                <label for="basq-id">Basquete</label>
            </div>
            <div>
                <input
                    type="checkbox"
                    name="sport[]"
                    id="vol-id"
                    value="volei"
                >
                <label for="vol-id">Volei</label>
            </div>
            <div>
                <input
                    type="checkbox"
                    name="sport[]"
                    id="nat-id"
                    value="natacao"
                >
                <label for="nat-id">Natação</label>
            </div>

        </fieldset>

        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
