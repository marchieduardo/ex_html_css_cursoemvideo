<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributos de formulários</title>
    <style>
        div {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Teste de formulário</h1>

    <form action="cadastro.py" method="get">
        <div>
            <label for="name-id">Nome:</label>
            <input
                type="text"
                name="user-name"
                id="name-id"
                required
                minlength="10"
                placeholder="Digite seu nome completo"
                autocomplete="name"
            >
        </div>
        <div>
            <label for="average-id">Média do aluno:</label>
            <input
                type="number"
                name="user-average"
                id="average-id"
                required
                min="0"
                max="10"
                placeholder="De 0 a 10"
                step="0.1"
            >
            <!--
                min e max = define o valor numérico ou data mínima/máxima em campos numéricos, de data ou range (diferente de minlength e maxlength, que tratam com strings);

                step = passo(quanto em quanto) do campo numérico. O padrão é "step='1'", e neste caso impossibilitaria de usar decimais. (funcionaria também usar "step='any'");
            -->
        </div>
        <div>
            <label for="month-id">Período letivo:</label>
            <input type="month" name="user-month" id="month-id" value="2026-01">
            <!--
                value = define um valor default para o input. Se tratando de month, o formato seria YYYY-MM;
            -->
        </div>
        <div>
            <label for="date-id">Dia da prova:</label>
            <input type="date" name="test-date" id="date-id">
        </div>
        <div>
            <label for="time-id">Hora da prova:</label>
            <input type="time" name="test-time" id="time-id">
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
