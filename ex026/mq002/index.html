<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Múltiplas Media Features com CSS</title>
    <link rel="stylesheet" href="css/style.css" media="all">
    <link rel="stylesheet" href="css/retrato.css" media="screen and (orientation: portrait)">
    <link rel="stylesheet" href="css/paisagem.css" media="screen and (orientation: landscape)">
    <!--
        Media features: condições usadas em media queries para aplicar CSS conforme o contexto do dispositivo/ambiente.
        Sintaxe: @media (feature: valor) { ... } ou combinadas com operadores como and.
        Exemplos comuns: (min-width: 768px), (max-width: 1200px), (orientation: landscape).
        Permitem criar layouts responsivos e adaptativos conforme as características do dispositivo.
    -->
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
</body>
</html>
