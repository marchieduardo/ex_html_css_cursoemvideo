<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do 
        
        <!-- Tamanho padrão do iframe = 300x150 px -->
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" scrolling="no">
            <a href="https://www.cursoemvideo.com/" target="_blank" rel="external">Curso em Vídeo</a> <!-- Conteúdo dentro do iframe aparecerá caso o navegador não consiga executa-lo -->
        </iframe> 
        
        para aprender a programar.
    </p>

    <p>O repositório do Guanabara <iframe src="https://gustavoguanabara.github.io/" frameborder="1"><a href="https://gustavoguanabara.github.io/" target="_blank" rel="external">no GitHub</a></iframe> também é bem legal!</p>
</body>
</html>
