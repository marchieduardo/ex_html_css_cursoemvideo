<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de células</title>
    <style>
        table {
            border-collapse: collapse;
            width: 300px;
        }

        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de células</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td> <!-- colspan = tamanho da célula em colunas -->
            <!-- <td>C</td> -->
        </tr>

        <tr>
            <td rowspan="3">D</td> <!-- rowspan = tamanho da célula em linhas -->
            <td>E</td>
            <td>F</td>
        </tr>

        <tr>
            <!-- <td>G</td> -->
            <td>H</td>
            <td>I</td>
        </tr>

        <tr>
            <!-- <td>J</td> -->
            <td>K</td>
            <td>L</td>
        </tr>
    </table>
</body>
</html>
