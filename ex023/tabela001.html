<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table {
            width: 400px;
            /*
            Propriedade border-collapse:
            separate = padrão (bordas separadas);
            collapse = junta as bordas;
            */
            border-collapse: collapse;
        }
        
        tr.linha-colorida {
            background-color: lightgray;
        }

        td {
            border: 1px solid black;
            padding: 5px;
        }

        td.dado-colorido {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--
        Hierarquia de tabelas (simples):
        Table = tabela;
        Table row (tr)= linha da tabela {
            Table header (th) = cabeçalho da tabela
            Table data (td) = dados da tabela
        };
    -->
    <table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha-colorida">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr class="linha-colorida">
            <td>A4</td>
            <td class="dado-colorido">B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
