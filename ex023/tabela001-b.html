<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento de conteúdo em tabelas</title>
    <style>
        table {
            width: 400px;
            height: 400px;
            /*
            Propriedade border-collapse:
            separate = padrão (bordas separadas);
            collapse = junta as bordas;
            */
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 5px;
            text-align: center; /* Alinhamento horizontal */
            vertical-align: top; /* Alinhamento vertical */
        }

        .alinhado-direita {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--
        Hierarquia de tabelas (simples):
        Table = tabela;
        Table row (tr)= linha da tabela {
            Table header (th) = cabeçalho da tabela
            Table data (td) = dados da tabela
        };
    -->
    <table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td class="alinhado-direita">C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td class="alinhado-direita">C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
